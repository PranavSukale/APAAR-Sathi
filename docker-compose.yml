services:
  postgres:
    image: postgres:16
    container_name: apaar_postgres
    environment:
      POSTGRES_USER: apaar_owner
      POSTGRES_PASSWORD: apaar_owner_pw
      POSTGRES_DB: apaar
    ports:
      - "5544:5432"
    volumes:
      - apaar_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apaar_owner -d apaar"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  apaar_pg:
